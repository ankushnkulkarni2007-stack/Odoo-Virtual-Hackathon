<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayflow HRMS</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-dim: #666e7a;
    --accent: #2f6df6;
    --accent-soft: #e8f0fe;
    --green: #1a7f52;
    --green-soft: #e3f5ec;
    --amber: #a05e03;
    --amber-soft: #fdf1dd;
    --red: #c0392b;
    --red-soft: #fdeaea;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f25;
      --surface-2: #24282f;
      --border: #2f343c;
      --text: #e8eaed;
      --text-dim: #9aa2ae;
      --accent: #6a9bff;
      --accent-soft: #1e2a44;
      --green: #4ade9b;
      --green-soft: #163a2a;
      --amber: #f0b45e;
      --amber-soft: #3d2f14;
      --red: #f47c73;
      --red-soft: #3d1f1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1,h2,h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label { display:block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
  .field { margin-bottom: 14px; }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 16px; font-weight: 500;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.ok { background: var(--green); }
  .btn.danger { background: var(--red); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }

  /* ---------- Login ---------- */
  #login {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px; width: 100%; max-width: 400px;
  }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px; background: var(--accent);
    display:grid; place-items:center; color:#fff; font-weight:700; font-size:16px;
  }
  .demo-list { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 16px; }
  .demo-btn {
    display:flex; justify-content:space-between; align-items:center; width: 100%;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 11px; margin-bottom: 7px; text-align: left; color: var(--text);
  }
  .demo-btn:hover { border-color: var(--accent); }

  /* ---------- Shell ---------- */
  #app { display: none; min-height: 100vh; grid-template-columns: 232px 1fr; }
  @media (max-width: 820px) { #app { grid-template-columns: 1fr; } .sidebar { display:none !important; } }
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 9px 12px; border-radius: 8px; color: var(--text-dim); font-weight: 500;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }
  .nav-sep { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); margin: 14px 0 4px 12px; }
  /* min-width:0 stops this grid item from being forced wider than the
     viewport by its own content — grid items default to min-width:auto,
     which is what makes narrow screens scroll sideways. */
  main { padding: 26px 30px 60px; max-width: 1150px; min-width: 0; }
  @media (max-width: 600px) { main { padding: 18px 16px 50px; } }
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom: 22px; flex-wrap: wrap; }
  .who { font-size: 13px; color: var(--text-dim); }
  .mobile-nav { display:none; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  @media (max-width: 820px) { .mobile-nav { display:flex; } }

  /* ---------- Bits ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 18px;
  }
  .card h3 { font-size: 15px; margin-bottom: 14px; }
  .grid { display: grid; gap: 14px; min-width: 0; }
  .grid > * { min-width: 0; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(240px,100%),1fr)); }
  .cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(150px,100%),1fr)); }
  .stat { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 15px; }
  .stat .n { font-size: 26px; font-weight: 650; letter-spacing:-0.02em; }
  /* For tiles holding a label rather than a figure — a job title at 26px
     wraps badly and competes with the real numbers beside it. */
  .stat .n.text { font-size: 16px; font-weight: 600; line-height: 1.35; }
  .stat .l { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-dim); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 20px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .pill.present, .pill.approved, .pill.active { background: var(--green-soft); color: var(--green); }
  .pill.absent, .pill.rejected { background: var(--red-soft); color: var(--red); }
  .pill.pending, .pill\.half-day, .pill.halfday { background: var(--amber-soft); color: var(--amber); }
  .pill.leave { background: var(--accent-soft); color: var(--accent); }
  .muted { color: var(--text-dim); }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap: wrap; }
  .row > * { flex: 1 1 150px; }
  .row > .shrink { flex: 0 0 auto; }
  .empty { padding: 26px; text-align:center; color: var(--text-dim); font-size: 14px; }
  .err {
    background: var(--red-soft); color: var(--red); padding: 10px 12px;
    border-radius: 8px; font-size: 13.5px; margin-bottom: 14px;
  }
  .err ul { margin: 6px 0 0; padding-left: 18px; }
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: var(--red); color: #fff; }
  dialog {
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    color: var(--text); padding: 22px; max-width: 460px; width: 92vw;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .spinner { padding: 30px; text-align:center; color: var(--text-dim); }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo">
      <div class="logo-mark">D</div>
      <div>
        <h1 style="font-size:19px">Dayflow</h1>
        <div class="muted" style="font-size:12.5px">Human Resource Management</div>
      </div>
    </div>

    <div id="loginErr"></div>

    <form id="loginForm" style="margin-top:20px">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" style="width:100%" type="submit" id="loginBtn">Sign in</button>
    </form>

    <div class="demo-list">
      <div class="muted" style="font-size:12.5px;margin-bottom:9px">
        Demo accounts — click to fill
      </div>
      <div id="demoAccounts"></div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <nav class="sidebar">
    <div class="logo" style="padding: 0 8px 14px">
      <div class="logo-mark">D</div>
      <h1 style="font-size:16px">Dayflow</h1>
    </div>
    <div id="navItems"></div>
    <div style="margin-top:auto;padding-top:14px">
      <button class="nav-item" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <div>
        <h2 id="viewTitle" style="font-size:21px"></h2>
        <div class="who" id="viewSub"></div>
      </div>
      <div class="who" id="whoami"></div>
    </div>
    <div class="mobile-nav" id="mobileNav"></div>
    <div id="view"><div class="spinner">Loading…</div></div>
  </main>
</div>

<div id="toast"></div>

<dialog id="modal">
  <h3 id="modalTitle" style="margin-bottom:14px"></h3>
  <div id="modalBody"></div>
</dialog>

<script>
/* ============================================================
   Dayflow HRMS — front end
   Talks to the Express API on the same origin, so no CORS setup.
   ============================================================ */

const DEMO_PASSWORD = 'Dayflow@123';
const DEMO_ACCOUNTS = [
  { email: 'rajesh@dayflow.com', label: 'Rajesh Menon', role: 'admin' },
  { email: 'priya@dayflow.com',  label: 'Priya Sharma', role: 'hr' },
  { email: 'aditi@dayflow.com',  label: 'Aditi Rao',    role: 'employee' },
];

const state = { token: null, user: null, employee: null, view: 'dashboard' };

/* ---------- storage (best effort — the app works without it) ---------- */
function saveToken(t) { try { sessionStorage.setItem('dayflow_token', t); } catch (e) {} }
function loadToken()  { try { return sessionStorage.getItem('dayflow_token'); } catch (e) { return null; } }
function clearToken() { try { sessionStorage.removeItem('dayflow_token'); } catch (e) {} }

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN',
  { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const money = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const titleCase = (s) => String(s || '').replace(/(^|[-\s])\w/g, (m) => m.toUpperCase());

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3200);
}

/** Turns the API's { message, errors[] } into one readable line. */
function errText(body, fallback) {
  if (!body) return fallback || 'Something went wrong';
  if (Array.isArray(body.errors) && body.errors.length) {
    return body.errors.map((e) => e.message).join(' · ');
  }
  return body.message || fallback || 'Something went wrong';
}

async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token && { Authorization: 'Bearer ' + state.token }),
    },
    ...(body && { body: JSON.stringify(body) }),
  });

  let json = null;
  try { json = await res.json(); } catch (e) {}

  if (res.status === 401 && state.token) {
    logout();
    throw new Error('Session expired — please sign in again');
  }
  if (!res.ok) {
    const err = new Error(errText(json));
    err.body = json;
    err.status = res.status;
    throw err;
  }
  return json;
}
const GET = (p) => api('GET', p);
const POST = (p, b) => api('POST', p, b);
const PATCH = (p, b) => api('PATCH', p, b);
const PUT = (p, b) => api('PUT', p, b);

const isManager = () => ['admin', 'hr'].includes(state.user?.role);
const isAdmin = () => state.user?.role === 'admin';

/* ============================================================
   Login
   ============================================================ */
$('demoAccounts').innerHTML = DEMO_ACCOUNTS.map((a) => `
  <button type="button" class="demo-btn" onclick="fillLogin('${a.email}')">
    <span>${esc(a.label)}</span>
    <span class="pill ${a.role === 'employee' ? 'leave' : 'approved'}">${esc(a.role)}</span>
  </button>`).join('');

function fillLogin(email) {
  $('email').value = email;
  $('password').value = DEMO_PASSWORD;
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('loginErr').innerHTML = '';
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Signing in…';
  try {
    const res = await POST('/auth/login', {
      email: $('email').value.trim(),
      password: $('password').value,
    });
    state.token = res.data.token;
    saveToken(state.token);
    await boot();
  } catch (err) {
    $('loginErr').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Sign in';
  }
};

function logout() {
  state.token = null;
  state.user = null;
  state.employee = null;
  clearToken();
  $('app').style.display = 'none';
  $('login').style.display = 'grid';
  $('password').value = '';
}

/* ============================================================
   Boot / navigation
   ============================================================ */
const VIEWS = {
  dashboard:  { title: 'Dashboard',      render: renderDashboard },
  profile:    { title: 'My Profile',     render: renderProfile },
  attendance: { title: 'Attendance',     render: renderAttendance },
  leave:      { title: 'Leave',          render: renderLeave },
  payroll:    { title: 'Payroll',        render: renderPayroll },
  employees:  { title: 'Employees',      render: renderEmployees, managerOnly: true },
  approvals:  { title: 'Leave Approvals', render: renderApprovals, managerOnly: true },
};

async function boot() {
  try {
    const me = await GET('/auth/me');
    state.user = me.data.user;
    state.employee = me.data.employee;
  } catch (err) {
    logout();
    return;
  }

  $('login').style.display = 'none';
  $('app').style.display = 'grid';

  $('whoami').innerHTML = `
    <strong>${esc(state.user.name)}</strong>
    <span class="pill ${isManager() ? 'approved' : 'leave'}" style="margin-left:7px">
      ${esc(state.user.role)}
    </span><br>
    <span class="muted">${esc(state.user.employeeId)}</span>`;

  const items = Object.entries(VIEWS)
    .filter(([, v]) => !v.managerOnly || isManager())
    .map(([key, v]) =>
      `<button class="nav-item" data-view="${key}" onclick="go('${key}')">${esc(v.title)}</button>`)
    .join('');
  $('navItems').innerHTML = items;
  $('mobileNav').innerHTML = Object.entries(VIEWS)
    .filter(([, v]) => !v.managerOnly || isManager())
    .map(([key, v]) =>
      `<button class="btn secondary sm" onclick="go('${key}')">${esc(v.title)}</button>`)
    .join('');

  if (!state.employee) {
    // Signed up but HR hasn't completed the record yet
    $('viewTitle').textContent = 'Welcome';
    $('view').innerHTML = `<div class="card">
      <h3>Your HR record isn't set up yet</h3>
      <p class="muted">Your account exists, but an Admin or HR officer still needs to create
      your employee record before attendance, leave and payroll become available.</p>
      <p class="muted">Employee ID: <strong>${esc(state.user.employeeId)}</strong></p>
    </div>`;
    return;
  }

  go('dashboard');
}

async function go(view) {
  state.view = view;
  const def = VIEWS[view];
  $('viewTitle').textContent = def.title;
  $('viewSub').textContent = '';
  document.querySelectorAll('.nav-item[data-view]').forEach((b) =>
    b.classList.toggle('active', b.dataset.view === view));
  $('view').innerHTML = '<div class="spinner">Loading…</div>';
  try {
    await def.render();
  } catch (err) {
    $('view').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}

const refresh = () => go(state.view);

/* ============================================================
   Dashboard
   ============================================================ */
async function renderDashboard() {
  if (isManager()) return renderManagerDashboard();
  return renderEmployeeDashboard();
}

async function renderEmployeeDashboard() {
  const d = today();
  const [att, leave] = await Promise.all([
    GET(`/attendance?startDate=${d}&endDate=${d}`),
    GET('/leave?limit=5'),
  ]);
  const rec = att.data[0];
  const bal = state.employee.leaveBalance || { paid: 0, sick: 0 };

  $('viewSub').textContent = fmtDate(d);
  $('view').innerHTML = `
    <div class="card">
      <h3>Today</h3>
      <div class="row">
        <div>
          <div class="muted" style="font-size:13px">Check-in</div>
          <div style="font-size:20px;font-weight:600">${rec?.checkIn || '—'}</div>
        </div>
        <div>
          <div class="muted" style="font-size:13px">Check-out</div>
          <div style="font-size:20px;font-weight:600">${rec?.checkOut || '—'}</div>
        </div>
        <div>
          <div class="muted" style="font-size:13px">Hours</div>
          <div style="font-size:20px;font-weight:600">${rec?.workingHours || 0}</div>
        </div>
        <div class="shrink">
          <button class="btn ok" onclick="doCheckIn()" ${rec?.checkIn ? 'disabled' : ''}>
            Check in
          </button>
        </div>
        <div class="shrink">
          <button class="btn" onclick="doCheckOut()"
            ${!rec?.checkIn || rec?.checkOut ? 'disabled' : ''}>Check out</button>
        </div>
      </div>
    </div>

    <div class="grid cols-4">
      <div class="stat"><div class="n">${bal.paid}</div><div class="l">Paid leave left</div></div>
      <div class="stat"><div class="n">${bal.sick}</div><div class="l">Sick leave left</div></div>
      <div class="stat"><div class="n">${leave.summary?.pending || 0}</div><div class="l">Pending requests</div></div>
      <div class="stat"><div class="n text">${esc(state.employee.designation)}</div><div class="l">${esc(titleCase(state.employee.department))}</div></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Recent leave requests</h3>
      ${leaveTable(leave.data, false)}
    </div>`;
}

async function renderManagerDashboard() {
  const d = today();
  const [emps, att, leave] = await Promise.all([
    GET('/employees?limit=1'),
    GET(`/attendance?startDate=${d}&endDate=${d}&limit=200`),
    GET('/leave?status=pending&limit=5'),
  ]);
  const s = att.summary || {};

  $('viewSub').textContent = fmtDate(d);
  $('view').innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="n">${emps.pagination.total}</div><div class="l">Employees</div></div>
      <div class="stat"><div class="n">${s.present || 0}</div><div class="l">Present today</div></div>
      <div class="stat"><div class="n">${s.absent || 0}</div><div class="l">Absent today</div></div>
      <div class="stat"><div class="n">${leave.summary?.pending || 0}</div><div class="l">Awaiting approval</div></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Pending leave requests</h3>
      ${leaveTable(leave.data, true)}
      ${leave.data.length ? `<button class="btn secondary sm" style="margin-top:12px"
        onclick="go('approvals')">Go to approvals</button>` : ''}
    </div>

    <div class="card">
      <h3>Today's attendance</h3>
      ${attendanceTable(att.data, true)}
    </div>`;
}

/* ============================================================
   Attendance
   ============================================================ */
async function doCheckIn() {
  const now = new Date().toTimeString().slice(0, 5);
  try {
    await POST('/attendance/check-in', {
      employeeId: state.user.employeeId, date: today(), checkIn: now,
    });
    toast('Checked in at ' + now);
    refresh();
  } catch (err) { toast(err.message, true); }
}

async function doCheckOut() {
  const now = new Date().toTimeString().slice(0, 5);
  try {
    await POST('/attendance/check-out', {
      employeeId: state.user.employeeId, date: today(), checkOut: now,
    });
    toast('Checked out at ' + now);
    refresh();
  } catch (err) { toast(err.message, true); }
}

function attendanceTable(rows, showName) {
  if (!rows.length) return '<div class="empty">No attendance records</div>';
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Date</th>${showName ? '<th>Employee</th>' : ''}
      <th>In</th><th>Out</th><th>Hours</th><th>Status</th>
    </tr></thead><tbody>
    ${rows.map((r) => `<tr>
      <td>${fmtDate(r.date)}</td>
      ${showName ? `<td>${esc(r.employee?.firstName || '')} ${esc(r.employee?.lastName || '')}
        <span class="muted">${esc(r.employeeId)}</span></td>` : ''}
      <td>${r.checkIn || '—'}</td>
      <td>${r.checkOut || '—'}</td>
      <td>${r.workingHours || 0}</td>
      <td><span class="pill ${esc(String(r.status).replace('-', ''))}">${esc(titleCase(r.status))}</span></td>
    </tr>`).join('')}
    </tbody></table></div>`;
}

async function renderAttendance() {
  const end = today();
  const start = new Date(Date.now() - 29 * 864e5).toISOString().slice(0, 10);
  const q = new URLSearchParams({ startDate: start, endDate: end, limit: '100' });
  if (isManager() && window._attEmp) q.set('employeeId', window._attEmp);

  const res = await GET('/attendance?' + q);
  const s = res.summary || {};

  $('view').innerHTML = `
    ${isManager() ? `<div class="card">
      <div class="row">
        <div>
          <label for="attEmp">Filter by employee ID (blank = everyone)</label>
          <input id="attEmp" placeholder="EMP-101" value="${esc(window._attEmp || '')}">
        </div>
        <div class="shrink"><button class="btn" onclick="applyAttFilter()">Apply</button></div>
        <div class="shrink"><button class="btn secondary" onclick="openMarkStatus()">Mark status</button></div>
      </div>
    </div>` : ''}

    <div class="grid cols-4">
      <div class="stat"><div class="n">${s.present || 0}</div><div class="l">Present</div></div>
      <div class="stat"><div class="n">${s.absent || 0}</div><div class="l">Absent</div></div>
      <div class="stat"><div class="n">${s['half-day'] || 0}</div><div class="l">Half days</div></div>
      <div class="stat"><div class="n">${s.totalHours || 0}</div><div class="l">Total hours</div></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Last 30 days</h3>
      ${attendanceTable(res.data, isManager())}
    </div>`;
}

function applyAttFilter() {
  window._attEmp = $('attEmp').value.trim();
  refresh();
}

function openMarkStatus() {
  showModal('Mark attendance status', `
    <div class="field"><label>Employee ID</label><input id="msEmp" placeholder="EMP-101"></div>
    <div class="field"><label>Date</label><input id="msDate" type="date" value="${today()}"></div>
    <div class="field"><label>Status</label>
      <select id="msStatus">
        <option value="present">Present</option>
        <option value="absent">Absent</option>
        <option value="half-day">Half day</option>
        <option value="leave">Leave</option>
      </select></div>
    <div class="field"><label>Remarks (optional)</label><input id="msRemarks"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="submitMarkStatus()">Save</button>
      <button class="btn secondary" onclick="modal.close()">Cancel</button>
    </div>`);
}

async function submitMarkStatus() {
  try {
    await PUT('/attendance/status', {
      employeeId: $('msEmp').value.trim(),
      date: $('msDate').value,
      status: $('msStatus').value,
      remarks: $('msRemarks').value.trim() || undefined,
    });
    modal.close();
    toast('Attendance updated');
    refresh();
  } catch (err) { toast(err.message, true); }
}

/* ============================================================
   Leave
   ============================================================ */
function leaveTable(rows, showName, withActions) {
  if (!rows.length) return '<div class="empty">No leave requests</div>';
  return `<div class="table-wrap"><table>
    <thead><tr>
      ${showName ? '<th>Employee</th>' : ''}
      <th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th>
      ${withActions ? '<th></th>' : ''}
    </tr></thead><tbody>
    ${rows.map((r) => `<tr>
      ${showName ? `<td>${esc(r.employee?.firstName || '')} ${esc(r.employee?.lastName || '')}
        <span class="muted">${esc(r.employeeId)}</span></td>` : ''}
      <td>${esc(titleCase(r.leaveType))}</td>
      <td>${fmtDate(r.startDate)}</td>
      <td>${fmtDate(r.endDate)}</td>
      <td>${r.totalDays}</td>
      <td style="max-width:220px">${esc(r.remarks)}
        ${r.reviewComments ? `<div class="muted" style="font-size:12.5px;margin-top:3px">
          ↳ ${esc(r.reviewComments)}</div>` : ''}</td>
      <td><span class="pill ${esc(r.status)}">${esc(titleCase(r.status))}</span></td>
      ${withActions ? `<td>${r.status === 'pending' ? `
        <div style="display:flex;gap:6px">
          <button class="btn ok sm" onclick="decide('${r._id}','approved')">Approve</button>
          <button class="btn danger sm" onclick="decide('${r._id}','rejected')">Reject</button>
        </div>` : '<span class="muted">—</span>'}</td>` : ''}
    </tr>`).join('')}
    </tbody></table></div>`;
}

async function renderLeave() {
  const res = await GET('/leave?limit=50');
  const bal = state.employee.leaveBalance || { paid: 0, sick: 0 };

  $('view').innerHTML = `
    <div class="card">
      <h3>Apply for leave</h3>
      <div id="leaveErr"></div>
      <div class="row">
        <div>
          <label for="lvType">Type</label>
          <select id="lvType">
            <option value="paid">Paid (${bal.paid} left)</option>
            <option value="sick">Sick (${bal.sick} left)</option>
            <option value="unpaid">Unpaid</option>
          </select>
        </div>
        <div><label for="lvStart">From</label><input id="lvStart" type="date" value="${today()}"></div>
        <div><label for="lvEnd">To</label><input id="lvEnd" type="date" value="${today()}"></div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="lvRemarks">Reason (5–300 characters)</label>
        <textarea id="lvRemarks" rows="2" placeholder="Why do you need this leave?"></textarea>
      </div>
      <button class="btn" onclick="applyLeave()">Submit request</button>
    </div>

    <div class="card">
      <h3>My requests</h3>
      ${leaveTable(res.data, isManager())}
    </div>`;
}

async function applyLeave() {
  $('leaveErr').innerHTML = '';
  try {
    await POST('/leave/apply', {
      employeeId: state.user.employeeId,
      leaveType: $('lvType').value,
      startDate: $('lvStart').value,
      endDate: $('lvEnd').value,
      remarks: $('lvRemarks').value.trim(),
    });
    toast('Leave request submitted');
    refresh();
  } catch (err) {
    const list = err.body?.errors;
    $('leaveErr').innerHTML = `<div class="err">${esc(err.message)}${
      list && list.length > 1 ? `<ul>${list.map((e) => `<li>${esc(e.message)}</li>`).join('')}</ul>` : ''
    }</div>`;
  }
}

async function renderApprovals() {
  const [pending, all] = await Promise.all([
    GET('/leave?status=pending&limit=50'),
    GET('/leave?limit=50'),
  ]);
  const s = all.summary || {};

  $('view').innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="n">${s.pending || 0}</div><div class="l">Pending</div></div>
      <div class="stat"><div class="n">${s.approved || 0}</div><div class="l">Approved</div></div>
      <div class="stat"><div class="n">${s.rejected || 0}</div><div class="l">Rejected</div></div>
      <div class="stat"><div class="n">${s.totalRequests || 0}</div><div class="l">Total</div></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Awaiting your decision</h3>
      ${leaveTable(pending.data, true, true)}
    </div>

    <div class="card">
      <h3>All requests</h3>
      ${leaveTable(all.data, true)}
    </div>`;
}

function decide(id, status) {
  showModal(`${status === 'approved' ? 'Approve' : 'Reject'} leave request`, `
    <div class="field">
      <label for="dcComments">Comments (optional)</label>
      <textarea id="dcComments" rows="3"
        placeholder="${status === 'approved' ? 'Approved.' : 'Reason for rejection'}"></textarea>
    </div>
    <div class="row">
      <button class="btn ${status === 'approved' ? 'ok' : 'danger'}"
        onclick="submitDecision('${id}','${status}')">Confirm ${esc(status)}</button>
      <button class="btn secondary" onclick="modal.close()">Cancel</button>
    </div>`);
}

async function submitDecision(id, status) {
  try {
    await PATCH(`/leave/${id}/decision`, {
      status,
      comments: $('dcComments').value.trim() || undefined,
    });
    modal.close();
    toast(`Request ${status}`);
    refresh();
  } catch (err) { toast(err.message, true); }
}

/* ============================================================
   Employees (manager only)
   ============================================================ */
async function renderEmployees() {
  const q = new URLSearchParams({ limit: '50' });
  if (window._empSearch) q.set('search', window._empSearch);
  if (window._empDept) q.set('department', window._empDept);

  const res = await GET('/employees?' + q);
  $('viewSub').textContent = `${res.pagination.total} record${res.pagination.total === 1 ? '' : 's'}`;

  const depts = ['engineering','hr','sales','marketing','finance','operations','support'];

  $('view').innerHTML = `
    <div class="card">
      <div class="row">
        <div>
          <label for="empSearch">Search</label>
          <input id="empSearch" placeholder="Name, ID or email" value="${esc(window._empSearch || '')}">
        </div>
        <div>
          <label for="empDept">Department</label>
          <select id="empDept">
            <option value="">All</option>
            ${depts.map((d) => `<option value="${d}" ${window._empDept === d ? 'selected' : ''}>
              ${esc(titleCase(d))}</option>`).join('')}
          </select>
        </div>
        <div class="shrink"><button class="btn" onclick="applyEmpFilter()">Search</button></div>
        <div class="shrink"><button class="btn secondary" onclick="openNewEmployee()">Add employee</button></div>
      </div>
    </div>

    <div class="card">
      ${res.data.length ? `<div class="table-wrap"><table>
        <thead><tr>
          <th>ID</th><th>Name</th><th>Department</th><th>Designation</th>
          <th>Phone</th><th>Joined</th><th>Status</th><th></th>
        </tr></thead><tbody>
        ${res.data.map((e) => `<tr>
          <td>${esc(e.employeeId)}</td>
          <td>${esc(e.fullName || e.firstName + ' ' + e.lastName)}<br>
            <span class="muted" style="font-size:12.5px">${esc(e.email)}</span></td>
          <td>${esc(titleCase(e.department))}</td>
          <td>${esc(e.designation)}</td>
          <td>${esc(e.phone)}</td>
          <td>${fmtDate(e.dateOfJoining)}</td>
          <td><span class="pill ${e.employmentStatus === 'active' ? 'active' : 'pending'}">
            ${esc(titleCase(e.employmentStatus))}</span></td>
          <td><button class="btn secondary sm"
            onclick="openEditEmployee('${esc(e.employeeId)}')">Edit</button></td>
        </tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No employees match those filters</div>'}
    </div>`;
}

function applyEmpFilter() {
  window._empSearch = $('empSearch').value.trim();
  window._empDept = $('empDept').value;
  refresh();
}

function openNewEmployee() {
  const depts = ['engineering','hr','sales','marketing','finance','operations','support'];
  showModal('Add employee record', `
    <p class="muted" style="font-size:13px;margin-top:0">
      The person must already have signed up — this links their HR record to that account.
    </p>
    <div id="neErr"></div>
    <div class="field"><label>Employee ID</label><input id="neId" placeholder="EMP-106"></div>
    <div class="row">
      <div class="field"><label>First name</label><input id="neFirst"></div>
      <div class="field"><label>Last name</label><input id="neLast"></div>
    </div>
    <div class="field"><label>Email</label><input id="neEmail" type="email"></div>
    <div class="row">
      <div class="field"><label>Phone</label><input id="nePhone" placeholder="9876543210"></div>
      <div class="field"><label>Gender</label>
        <select id="neGender"><option value="male">Male</option>
        <option value="female">Female</option><option value="other">Other</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Date of birth</label><input id="neDob" type="date"></div>
      <div class="field"><label>Date of joining</label><input id="neDoj" type="date" value="${today()}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Department</label>
        <select id="neDept">${depts.map((d) => `<option value="${d}">${esc(titleCase(d))}</option>`).join('')}</select></div>
      <div class="field"><label>Designation</label><input id="neDesig"></div>
    </div>
    <div class="field"><label>Starting salary</label><input id="neSalary" type="number" value="50000"></div>
    <div class="row">
      <button class="btn" onclick="submitNewEmployee()">Create</button>
      <button class="btn secondary" onclick="modal.close()">Cancel</button>
    </div>`);
}

async function submitNewEmployee() {
  $('neErr').innerHTML = '';
  try {
    await POST('/employees', {
      employeeId: $('neId').value.trim(),
      firstName: $('neFirst').value.trim(),
      lastName: $('neLast').value.trim(),
      email: $('neEmail').value.trim(),
      phone: $('nePhone').value.trim(),
      gender: $('neGender').value,
      dateOfBirth: $('neDob').value,
      dateOfJoining: $('neDoj').value,
      department: $('neDept').value,
      designation: $('neDesig').value.trim(),
      salary: Number($('neSalary').value),
    });
    modal.close();
    toast('Employee created');
    refresh();
  } catch (err) {
    const list = err.body?.errors;
    $('neErr').innerHTML = `<div class="err">${esc(err.message)}${
      list ? `<ul>${list.map((e) => `<li>${esc(e.message)}</li>`).join('')}</ul>` : ''
    }</div>`;
  }
}

async function openEditEmployee(employeeId) {
  const res = await GET('/employees/' + employeeId);
  const e = res.data;
  showModal(`Edit ${e.employeeId}`, `
    <div id="eeErr"></div>
    <div class="row">
      <div class="field"><label>First name</label><input id="eeFirst" value="${esc(e.firstName)}"></div>
      <div class="field"><label>Last name</label><input id="eeLast" value="${esc(e.lastName)}"></div>
    </div>
    <div class="field"><label>Phone</label><input id="eePhone" value="${esc(e.phone)}"></div>
    <div class="field"><label>Designation</label><input id="eeDesig" value="${esc(e.designation)}"></div>
    <div class="field"><label>Address</label><input id="eeAddress" value="${esc(e.address || '')}"></div>
    <div class="field"><label>Employment status</label>
      <select id="eeStatus">
        ${['active','on-notice','resigned','terminated'].map((s) =>
          `<option value="${s}" ${e.employmentStatus === s ? 'selected' : ''}>${esc(titleCase(s))}</option>`).join('')}
      </select></div>
    <p class="muted" style="font-size:12.5px">Salary is changed from the Payroll page so each
    change keeps an effective date and history.</p>
    <div class="row">
      <button class="btn" onclick="submitEditEmployee('${esc(employeeId)}')">Save</button>
      <button class="btn secondary" onclick="modal.close()">Cancel</button>
    </div>`);
}

async function submitEditEmployee(employeeId) {
  $('eeErr').innerHTML = '';
  try {
    await PATCH(`/employees/${employeeId}/admin`, {
      firstName: $('eeFirst').value.trim(),
      lastName: $('eeLast').value.trim(),
      phone: $('eePhone').value.trim(),
      designation: $('eeDesig').value.trim(),
      address: $('eeAddress').value.trim(),
      employmentStatus: $('eeStatus').value,
    });
    modal.close();
    toast('Employee updated');
    refresh();
  } catch (err) {
    $('eeErr').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}

/* ============================================================
   My profile
   ============================================================ */
async function renderProfile() {
  const e = state.employee;
  const row = (label, value) =>
    `<div><div class="muted" style="font-size:12.5px">${esc(label)}</div>
     <div style="font-weight:500">${esc(value ?? '—')}</div></div>`;

  $('view').innerHTML = `
    <div class="card">
      <h3>Personal details</h3>
      <div class="grid cols-2">
        ${row('Employee ID', e.employeeId)}
        ${row('Full name', e.fullName || `${e.firstName} ${e.lastName}`)}
        ${row('Email', e.email)}
        ${row('Gender', titleCase(e.gender))}
        ${row('Date of birth', fmtDate(e.dateOfBirth))}
        ${row('Age', e.age)}
      </div>
    </div>

    <div class="card">
      <h3>Job details</h3>
      <div class="grid cols-2">
        ${row('Department', titleCase(e.department))}
        ${row('Designation', e.designation)}
        ${row('Date of joining', fmtDate(e.dateOfJoining))}
        ${row('Employment status', titleCase(e.employmentStatus))}
      </div>
    </div>

    <div class="card">
      <h3>Editable details</h3>
      <p class="muted" style="font-size:13px;margin-top:-8px">
        You can change your phone, address and profile picture. Everything else is managed by HR.
      </p>
      <div id="profErr"></div>
      <div class="field"><label for="pfPhone">Phone</label>
        <input id="pfPhone" value="${esc(e.phone)}"></div>
      <div class="field"><label for="pfAddress">Address</label>
        <input id="pfAddress" value="${esc(e.address || '')}"></div>
      <div class="field"><label for="pfPic">Profile picture URL</label>
        <input id="pfPic" value="${esc(e.profilePicture || '')}" placeholder="https://…/photo.jpg"></div>
      <button class="btn" onclick="saveProfile()">Save changes</button>
    </div>`;
}

async function saveProfile() {
  $('profErr').innerHTML = '';
  const body = {
    phone: $('pfPhone').value.trim(),
    address: $('pfAddress').value.trim(),
  };
  const pic = $('pfPic').value.trim();
  if (pic) body.profilePicture = pic;

  try {
    const res = await PATCH(`/employees/${state.user.employeeId}/self`, body);
    state.employee = res.data;
    toast('Profile updated');
    refresh();
  } catch (err) {
    const list = err.body?.errors;
    $('profErr').innerHTML = `<div class="err">${esc(err.message)}${
      list ? `<ul>${list.map((x) => `<li>${esc(x.message)}</li>`).join('')}</ul>` : ''
    }</div>`;
  }
}

/* ============================================================
   Payroll
   ============================================================ */
async function renderPayroll() {
  if (isManager()) return renderPayrollAdmin();

  const res = await GET('/payroll');
  const p = res.data;
  $('view').innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="n">${money(p.basicSalary)}</div><div class="l">Basic salary</div></div>
      <div class="stat"><div class="n">${money(p.allowances)}</div><div class="l">Allowances</div></div>
      <div class="stat"><div class="n">${money(p.deductions)}</div><div class="l">Deductions</div></div>
      <div class="stat"><div class="n">${money(p.netSalary)}</div><div class="l">Net salary</div></div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>Details</h3>
      <p class="muted" style="font-size:13px;margin-top:-8px">
        Payroll is read-only. Contact HR about any discrepancy.
      </p>
      <div class="grid cols-2">
        <div><div class="muted" style="font-size:12.5px">Gross salary</div>
          <div style="font-weight:500">${money(p.grossSalary)}</div></div>
        <div><div class="muted" style="font-size:12.5px">Effective from</div>
          <div style="font-weight:500">${fmtDate(p.effectiveFrom)}</div></div>
      </div>
    </div>`;
}

async function renderPayrollAdmin() {
  const res = await GET('/payroll?limit=50');
  $('view').innerHTML = `
    <div class="card">
      ${res.data.length ? `<div class="table-wrap"><table>
        <thead><tr>
          <th>ID</th><th>Employee</th><th>Basic</th><th>Allowances</th>
          <th>Deductions</th><th>Net</th><th>Effective</th>${isAdmin() ? '<th></th>' : ''}
        </tr></thead><tbody>
        ${res.data.map((p) => `<tr>
          <td>${esc(p.employeeId)}</td>
          <td>${esc(p.employee?.firstName || '')} ${esc(p.employee?.lastName || '')}<br>
            <span class="muted" style="font-size:12.5px">${esc(p.employee?.designation || '')}</span></td>
          <td>${money(p.basicSalary)}</td>
          <td>${money(p.allowances)}</td>
          <td>${money(p.deductions)}</td>
          <td><strong>${money(p.netSalary)}</strong></td>
          <td>${fmtDate(p.effectiveFrom)}</td>
          ${isAdmin() ? `<td><button class="btn secondary sm"
            onclick="openSalaryEdit('${esc(p.employeeId)}',${p.basicSalary},${p.allowances},${p.deductions})">
            Revise</button></td>` : ''}
        </tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No payroll records</div>'}
    </div>
    ${!isAdmin() ? `<p class="muted" style="font-size:13px">
      Salary changes are restricted to Admin accounts.</p>` : ''}`;
}

function openSalaryEdit(employeeId, basic, allowances, deductions) {
  showModal(`Revise salary — ${employeeId}`, `
    <p class="muted" style="font-size:13px;margin-top:0">
      This creates a new salary record with an effective date. The previous one is
      kept as history rather than overwritten.
    </p>
    <div id="seErr"></div>
    <div class="field"><label>Basic salary</label>
      <input id="seBasic" type="number" value="${basic}"></div>
    <div class="row">
      <div class="field"><label>Allowances</label>
        <input id="seAllow" type="number" value="${allowances}"></div>
      <div class="field"><label>Deductions</label>
        <input id="seDeduct" type="number" value="${deductions}"></div>
    </div>
    <div class="field"><label>Effective from</label>
      <input id="seDate" type="date" value="${today()}"></div>
    <div class="row">
      <button class="btn" onclick="submitSalary('${esc(employeeId)}')">Save revision</button>
      <button class="btn secondary" onclick="modal.close()">Cancel</button>
    </div>`);
}

async function submitSalary(employeeId) {
  $('seErr').innerHTML = '';
  try {
    await PUT('/payroll/' + employeeId, {
      basicSalary: Number($('seBasic').value),
      allowances: Number($('seAllow').value),
      deductions: Number($('seDeduct').value),
      effectiveFrom: $('seDate').value,
    });
    modal.close();
    toast('Salary revised');
    refresh();
  } catch (err) {
    const list = err.body?.errors;
    $('seErr').innerHTML = `<div class="err">${esc(err.message)}${
      list ? `<ul>${list.map((e) => `<li>${esc(e.message)}</li>`).join('')}</ul>` : ''
    }</div>`;
  }
}

/* ============================================================
   Modal
   ============================================================ */
const modal = $('modal');
function showModal(title, html) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  modal.showModal();
}

/* ---------- start ---------- */
(function start() {
  const saved = loadToken();
  if (saved) {
    state.token = saved;
    boot();
  }
})();
</script>
</body>
</html>
